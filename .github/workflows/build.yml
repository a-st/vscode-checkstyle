name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbfile-dev pkg-config libsecret-1-dev libxss1 dbus xvfb libgtk-3-0 libgbm1
          sudo /usr/bin/Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node.js modules
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build OSGi bundle
        run: npm run build-plugin

      - name: Build .vsix
        run: npx @vscode/vsce@latest package

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node.js modules
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build OSGi bundle
        run: npm run build-plugin

      - name: Build .vsix
        run: npx @vscode/vsce@latest package

  darwin:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node.js modules
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build OSGi bundle
        run: npm run build-plugin

      - name: Build .vsix
        run: npx @vscode/vsce@latest package
